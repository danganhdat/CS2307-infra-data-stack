name: infra

on:
  push:
    branches: [main]
    paths: ["terraform/**", ".github/workflows/infra.yml"]
  pull_request:
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    # terraform.tfvars is gitignored (local-only), so CI supplies the required
    # variables here. github_repo comes from the built-in context — always
    # "owner/repo" with no ".git", so it can't drift from the WIF condition.
    # Set GCP_PROJECT_ID as a repo Variable (Settings → Secrets and variables
    # → Actions → Variables).
    env:
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_github_repo: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.DEPLOYER_SA }}

      - uses: hashicorp/setup-terraform@v3

      - run: terraform init
      - run: terraform plan -input=false

      - name: Apply (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: terraform apply -auto-approve -input=false

# Behavior: push/PR runs `init` + `plan` only (visibility, stays green). `apply`
# runs ONLY on a manual "Run workflow" (workflow_dispatch), and even then it
# succeeds only if the deployer service account has rights to manage these
# resources (networks, secrets, IAM, compute) — e.g. roles/editor +
# roles/resourcemanager.projectIamAdmin, scope carefully.
# Recommended default: apply infra locally (`cd terraform && terraform apply`)
# and let CI handle plan for visibility.
