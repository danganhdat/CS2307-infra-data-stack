name: data-stack

# Direct IP:port access. Each service publishes its own port on the VM, and the
# GCP firewall (allow-services) controls who can reach them.
#   Postgres  <public_ip>:5432
#   Neo4j     http://<public_ip>:7474   (Bolt on 7687)
#   MinIO S3  http://<public_ip>:9000
#   MinIO UI  http://<public_ip>:9001
#   pgAdmin   http://<public_ip>:8080

networks:
  backend:
    driver: bridge

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /mnt/data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks: [backend]
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 1G
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 1G
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - /mnt/data/neo4j/data:/data
      - /mnt/data/neo4j/logs:/logs
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - /mnt/data/minio:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    networks: [backend]

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    depends_on: [postgres]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com          # login id (not sensitive)
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}    # from Secret Manager
      PGADMIN_LISTEN_PORT: 8080
    volumes:
      - /mnt/data/pgadmin:/var/lib/pgadmin   # host dir must be owned by uid 5050
    ports:
      - "8080:8080"
    networks: [backend]
